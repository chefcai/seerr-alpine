name: Build and Push seerr-alpine Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Rebuild even if this upstream commit is already published (picks up base-image/apk security fixes)'
        type: boolean
        default: false
  schedule:
    # Daily at 06:45 UTC (staggered 45 min after bazarr-alpine, 30 after
    # jellyfin-alpine, 15 after ttyd-alpine). Skips automatically if upstream
    # seerr commit is already published — see "Check if image already exists".
    - cron: '45 6 * * *'
    # Periodic base refresh: monthly on the 1st at 07:15 UTC, forces a
    # rebuild against the current alpine:3.22 base + apk index even when the
    # upstream seerr commit hasn't changed, so security fixes aren't stuck
    # behind an app release (HOMELAB-91 finding #2).
    - cron: '15 7 1 * *'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Serialize runs on this ref. If a second run is queued for the same ref while
# one is in flight, the older still-in-flight run gets cancelled — prevents the
# parallel-push race where a slower-finishing build overwrites :latest with
# stale bits (which happened on 2026-04-25 between iter 9 and iter 10).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Determine if this run is the periodic base-refresh cron
        id: base_refresh
        run: |
          # The second schedule entry (monthly, day-of-month 1) is the base
          # refresh; the daily 06:45 entry is the normal version-check run.
          # github.event.schedule carries the exact cron string that fired.
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "15 7 1 * *" ]; then
            echo "is_base_refresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_base_refresh=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get seerr commit SHA from upstream tag
        id: seerr_version
        run: |
          # preview-new-oidc is a TAG on upstream, not a branch — use the bare
          # name so git ls-remote matches refs/tags/. (Initial naive
          # 'refs/heads/preview-new-oidc' returned empty and broke SHA tagging.)
          FULL_SHA=$(git ls-remote https://github.com/seerr-team/seerr.git preview-new-oidc | awk 'NR==1{print $1}')
          if [ -z "$FULL_SHA" ]; then
            echo "::error::Could not resolve upstream seerr commit SHA for preview-new-oidc"
            exit 1
          fi
          REF=$(echo "$FULL_SHA" | cut -c1-12)
          echo "version=$REF" >> "$GITHUB_OUTPUT"
          # Full SHA is what actually gets built (see Dockerfile issue #3) --
          # the short $REF above is kept only for image tagging.
          echo "full_sha=$FULL_SHA" >> "$GITHUB_OUTPUT"
          echo "seerr commit: $REF (full: $FULL_SHA)"

      - name: Check if image already exists for this version
        id: check
        run: |
          VERSION="${{ steps.seerr_version.outputs.version }}"
          TOKEN=$(curl -fsSL "https://ghcr.io/token?scope=repository:${{ github.repository }}:pull" | jq -r .token)
          HTTP=$(curl -sSL -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/${{ github.repository }}/manifests/$VERSION")
          if [ "$HTTP" = "200" ] && [ "${{ steps.base_refresh.outputs.is_base_refresh }}" != "true" ] && [ "${{ inputs.force_rebuild }}" != "true" ]; then
            echo "needs_build=false" >> $GITHUB_OUTPUT
            echo "::notice::Upstream seerr commit $VERSION already published — skipping build."
          else
            echo "needs_build=true" >> $GITHUB_OUTPUT
            if [ "${{ steps.base_refresh.outputs.is_base_refresh }}" = "true" ]; then
              echo "::notice::Monthly base-refresh run — rebuilding $VERSION against current alpine base regardless of publish state."
            elif [ "${{ inputs.force_rebuild }}" = "true" ]; then
              echo "::notice::force_rebuild requested — rebuilding $VERSION regardless of publish state."
            else
              echo "::notice::Upstream seerr commit $VERSION not yet published (HTTP $HTTP) — will build."
            fi
          fi

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'schedule' || steps.check.outputs.needs_build == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        if: github.event_name != 'schedule' || steps.check.outputs.needs_build == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Only the default branch publishes :latest and :<version>.
          # Any other branch (workflow_dispatch --ref <branch>) publishes
          # :branch-<name> so test builds can never overwrite production tags.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.seerr_version.outputs.version }},enable={{is_default_branch}}
            type=ref,event=branch,prefix=branch-,enable=${{ github.ref_name != 'main' }}

      - name: Set up Docker Buildx
        if: github.event_name != 'schedule' || steps.check.outputs.needs_build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build image (load locally for smoke test)
        if: github.event_name != 'schedule' || steps.check.outputs.needs_build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          build-args: |
            SEERR_REF=${{ steps.seerr_version.outputs.full_sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — boot container and check /api/v1/status
        if: github.event_name != 'schedule' || steps.check.outputs.needs_build == 'true'
        run: |
          set -e
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          CID=$(docker run -d -p 5055:5055 "$IMAGE")
          trap 'docker logs "$CID" || true; docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT

          ok=false
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5055/api/v1/status || true)
            if [ "$code" = "200" ]; then
              ok=true
              break
            fi
            sleep 2
          done

          if [ "$ok" != "true" ]; then
            echo "::error::/api/v1/status did not return 200 within 60s"
            exit 1
          fi
          echo "Smoke test passed: /api/v1/status returned 200"

      - name: Push image
        if: (github.event_name != 'schedule' || steps.check.outputs.needs_build == 'true') && github.event_name != 'pull_request'
        run: |
          for tag in $(echo "${{ steps.meta.outputs.tags }}"); do
            docker push "$tag"
          done
